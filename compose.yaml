services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '5000'
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      MONGODB_DNS_SERVERS: ${MONGODB_DNS_SERVERS:-}
    ports:
      - '127.0.0.1:5000:5000'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/logs:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
